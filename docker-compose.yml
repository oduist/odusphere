# OduSphere local stack: Postgres + Odoo (backend) + Caddy (gateway).
# Caddy is the single entry point: it serves the built Astro site (website/dist)
# and proxies dynamic traffic to Odoo. It coexists with Oduflow (.oduflow/) and
# does not replace it.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "odoo"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  odoo:
    image: odoo:19
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./addons:/mnt/extra-addons:ro
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro
      - odoo-data:/var/lib/odoo
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    # Do not publish ports to the host — access only through Caddy.
    # 8069 — HTTP, 8072 — gevent bus worker (websocket).
    expose:
      - "8069"
      - "8072"
    restart: unless-stopped

  caddy:
    image: caddy:2
    depends_on:
      - odoo
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Sphere-local routes imported by the Caddyfile (`import sphere.caddy`).
      - ./sphere.caddy:/etc/caddy/sphere.caddy:ro
      - ./website/dist:/srv:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  db-data:
  odoo-data:
  caddy-data:
  caddy-config:
